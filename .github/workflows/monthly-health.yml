name: Monthly Health Check

on:
  schedule:
    - cron: '0 14 1 * *'  # 1st of month, 14:00 UTC (10:00 AM EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generator dependencies
        run: pip install -r requirements.txt

      # ── Content generation (non-fatal: a provider hiccup must not break the
      #    health check or the date stamp below). The failover chain skips any
      #    provider whose key is missing. ──────────────────────────────────────
      - name: Generate new glossary terms
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generators/generate_glossary_terms.py --count=5

      - name: Generate new bonus prompts
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generators/generate_bonus_prompts.py

      # ── Validate JSON + recompute counts (runs AFTER generation so the badge
      #    reflects freshly added content). A broken JSON file fails the run. ──
      - name: Validate JSON data files + compute current counts
        id: counts
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          from pathlib import Path

          stats = {}
          errors = []

          def load(p):
              try:
                  return json.load(open(p))
              except Exception as e:
                  errors.append(f"{p}: {e}")
                  return None

          agents = load("agents/agents_data.json") or {}
          stats["agents"] = sum(len(d.get("agents", [])) for d in agents.get("departments", {}).values())
          stats["departments"] = len(agents.get("departments", {}))

          playbooks = load("agents/playbooks_data.json") or {}
          stats["playbooks"] = len(playbooks.get("playbooks", []))

          glossary = load("agents/glossary_data.json") or {}
          stats["glossary"] = len(glossary.get("terms", []))

          guides = load("agents/guides_data.json") or {}
          stats["guides"] = len(guides.get("guides", []))

          bonus = load("agents/bonus_prompts.json") or {}
          stats["bonus"] = sum(len(v) for v in bonus.get("departments", {}).values())

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          for k, v in stats.items():
              print(f"{k}={v}")
          print(f"summary={stats['agents']} agents · {stats['playbooks']} playbooks · {stats['glossary']} glossary · {stats['guides']} guides · {stats['bonus']} bonus prompts")
          PY

      - name: Update README badge + last-verified date
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BADGE="_📊 Library: ${{ steps.counts.outputs.summary }} · Last verified by CI: ${DATE}_"
          if grep -q "^_📊 Library:" README.md; then
            python -c "
          import re
          p = open('README.md').read()
          p = re.sub(r'^_📊 Library:.*\$', '''$BADGE''', p, flags=re.MULTILINE)
          open('README.md','w').write(p)
          "
          else
            printf "\n---\n\n%s\n" "$BADGE" >> README.md
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/*.json README.md
          if ! git diff --staged --quiet; then
            git commit -m "ci: monthly health check $(date -u +%Y-%m) — ${{ steps.counts.outputs.summary }}"
            git push
          else
            echo "Nothing changed this run"
          fi
